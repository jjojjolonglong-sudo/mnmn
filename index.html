<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mnmn · 이미지 관리</title>
<script src="fonts.v1.js" data-app="mnmn"></script>
<style>
:root{--bg:#fafaf7;--fg:#222;--mut:#777;--card:#fff;--ln:#ddd;--ac:#2f6fed;--rd:#d33;--gn:#2a8a4a}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#eee;--mut:#999;--card:#222226;--ln:#38383e;--ac:#6b9bff;--rd:#ff6b6b;--gn:#5fd08a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header b{font-size:16px;margin-right:auto}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.on{border-color:var(--ac);color:var(--ac);font-weight:600}button.danger{color:var(--rd);border-color:var(--rd)}
main{padding:14px;max-width:1100px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.sum{color:var(--mut)}
#msg{padding:8px 12px;margin:10px 0;border-radius:6px;background:var(--card);border:1px solid var(--ln)}#msg.err{color:var(--rd);border-color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px;position:relative;font-size:12px}
.c.sel{outline:2px solid var(--rd)}.c img{width:100%;height:150px;object-fit:contain;background:#8881;border-radius:4px;display:block}
.c input{position:absolute;top:10px;left:10px;width:18px;height:18px;padding:0}
.t{color:var(--mut);word-break:break-all}.u{color:var(--gn)}.n{color:var(--rd);font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid var(--ln)}.row img{width:48px;height:48px;object-fit:contain;background:#8881;border-radius:4px}.row .t{flex:1}
h3{margin:18px 0 6px;font-size:14px}.fa{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--ln)}.fa select{width:100%;min-width:0}.fa .pv{grid-column:2/4;color:var(--mut);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fh{font-weight:600;margin-top:12px}.fh small{color:var(--mut);font-weight:400}
#busy{position:fixed;left:0;right:0;top:0;z-index:50;padding:9px 14px;background:#f5b400;color:#222;font-weight:700;text-align:center;box-shadow:0 2px 8px #0004}body.busy header,body.busy main{padding-top:0}body.busy #app{margin-top:40px}body.busy button,body.busy select{opacity:.5;cursor:wait}
#login{max-width:320px;margin:15vh auto;padding:0 14px;display:grid;gap:8px}[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>mnmn · 이미지 관리</h2>
  <input id="em" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="go" class="on">로그인</button>
  <div id="lmsg" class="n"></div>
</div>
<div id="busy" hidden>⏳ 작업 중이에요. 끝날 때까지 화면을 전환하거나 새로고침하지 말고 기다려 주세요</div>
<div id="app" hidden>
  <header><b>mnmn</b>
    <button data-tab="img" class="on">이미지</button><button data-tab="trash">휴지통</button><button data-tab="inbox">원본 대기</button><button data-tab="dir">원본 폴더</button><button data-tab="font">글꼴</button><button data-tab="bak">백업</button>
    <button id="out">로그아웃</button>
  </header>
  <main><div id="msg" hidden></div><div id="view"></div></main>
</div>
<script src="config.js"></script>
<script src="core.v1.js" data-app="mnmn"></script>
<script src="media.js"></script>
<script>
const CFG=window.APP_CONFIG||{};
const SB=CFG.SB||'https://rtvvajhsnwkkrmncyfbs.supabase.co';
const ANON=CFG.ANON||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
const W=(CFG.MEDIA||'https://media.jjojjolonglong.workers.dev').replace(/\/$/,'');
/* 이미지 해시가 저장되는 곳: [테이블, 컬럼]. 새 앱/컬럼이 생기면 여기에 한 줄 추가 */
const SRC=[['bkbk_books','cover'],['mvmv_movie','poster'],['mvmv_movie_people','thumb'],['mvmv_scene','image'],['didi_category','image_url'],['didi_index','image_url'],['didi_log','image_url'],['wkwk_work','cover'],['smsm_profile','profile'],['smsm_album','photo'],['cdcd_album','cover'],['lvlv_image','image'],['mgwg_store','photo'],['mgwg_sort','photo'],['mgwg_item','photo']];
const ID_TABLES=['didi_log','didi_index','didi_category','mvmv_scene','lvlv_image','smsm_album'];   // 원본(inbox)이 행 id로 저장되는 테이블
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n<1024?n+'B':n<1048576?(n/1024).toFixed(1)+'KB':(n/1048576).toFixed(1)+'MB';
const day=d=>new Date(d).toLocaleDateString('ko-KR');
const hashOf=k=>k.split('/').pop().replace(/\.\w+$/,'');

/* ---------- 로그인 ---------- */
let SES=null;try{SES=JSON.parse(localStorage.getItem('jjojjo_ses')||'null')}catch(e){}
const saveSes=s=>{SES=s;try{s?localStorage.setItem('jjojjo_ses',JSON.stringify(s)):localStorage.removeItem('jjojjo_ses')}catch(e){}};
async function gotrue(grant,body){
  const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'로그인 실패');
  j.expires_at=Date.now()+j.expires_in*1000;return j;
}
let rf=null;
async function token(){
  try{SES=JSON.parse(localStorage.getItem('jjojjo_ses')||'null')}catch(e){}if(!SES)throw new Error('로그인이 필요해요');
  if(SES.expires_at-Date.now()<60000){rf=rf||gotrue('refresh_token',{refresh_token:SES.refresh_token}).then(s=>{saveSes(s)}).finally(()=>{rf=null});await rf}
  return SES.access_token;
}
Media.init({getToken:token});

/* ---------- Supabase 읽기 (1000행씩 이어서) ---------- */
async function rows(table,sel,filter){
  const out=[];
  for(let from=0;;from+=1000){
    const r=await fetch(`${SB}/rest/v1/${table}?select=${sel}${filter||''}`,{headers:{apikey:ANON,Authorization:'Bearer '+await token(),Range:`${from}-${from+999}`,'Range-Unit':'items'}});
    if(r.status===416)break;if(!r.ok)throw new Error(`${table}: HTTP ${r.status}`);
    const j=await r.json();out.push(...j);if(j.length<1000)break;
  }
  return out;
}
async function scan(){   // 해시 → {'테이블.컬럼': 개수}
  const use=new Map();
  for(const [t,c] of SRC)for(const r of await rows(t,c,`&${c}=not.is.null`)){
    const h=r[c];if(!h)continue;const m=use.get(h)||{},k=t+'.'+c;m[k]=(m[k]||0)+1;use.set(h,m);
  }
  return use;
}


/* ---------- 원본 폴더 (앱마다 따로 지정) ---------- */
const DIR_APPS=[['','공통 (기본)'],['didi','didi 일기'],['mvmv','mvmv 영상'],['lvlv','lvlv 덕질노트'],['smsm','smsm 심즈']];
const ROUTE={didi_log:'didi',didi_index:'didi',didi_category:'didi',mvmv_scene:'mvmv',lvlv_image:'lvlv',smsm_album:'smsm'};   // 원본이 저장되는 테이블 → 앱
async function loadDirs(){
  const out=[];
  for(const [app,label] of DIR_APPS){
    const own=await Media.folder.own(app),eff=await Media.folder.saved(app);
    let perm='';if(eff&&typeof eff.queryPermission==='function')perm=await eff.queryPermission({mode:'readwrite'});
    out.push({app,label,own:own?own.name:'',eff:eff?eff.name:'',perm,fallback:!own&&!!eff&&!!app});
  }
  return out;
}
function vDir(){
  if(!Media.folder.supported)return '<div class="sum">이 브라우저에서는 폴더를 지정할 수 없어요. PC의 Chrome이나 Edge에서 열어 주세요.</div>';
  return `<div class="sum">원본 사진을 모아 둘 PC 폴더를 앱마다 정해요. 앱 전용 폴더를 정하지 않은 앱은 "공통" 폴더를 써요. 이 폴더 지정은 이 PC·이 브라우저에만 저장돼요.</div>
  ${S.dirs.map(d=>`<div class="row"><div class="t"><b>${E(d.label)}</b><br>${d.own?'📁 '+E(d.own):d.fallback?'공통 폴더 사용'+(d.eff?' ('+E(d.eff)+')':''):d.eff?'':'지정 안 됨'}${d.eff?(d.perm==='granted'?' · ✅ 권한 있음':' · ⚠️ 권한 필요'):''}</div>
    <button data-a="dset" data-app="${E(d.app)}">폴더 지정</button>${d.eff&&d.perm!=='granted'?`<button data-a="dperm" data-app="${E(d.app)}">권한 허용</button>`:''}${d.own?`<button data-a="dclr" data-app="${E(d.app)}">해제</button>`:''}</div>`).join('')}
  <h3>원본 받기</h3><div class="hint">폰에서 올려서 서버에 대기 중인 원본을 각 앱의 폴더로 가져오고 서버에서는 비워요. 가져오기 전에 위 폴더들의 권한이 "있음"이어야 해요.</div>
  <button data-a="dpull">원본 받기</button><div id="dmsg" class="hint"></div>`;
}
async function dirAction(a,app){
  if(a==='dset'){await Media.folder.connect(app);say('폴더를 지정했어요')}
  else if(a==='dperm'){const h=await Media.folder.ensure(app);say(h?'권한을 허용했어요':'권한이 허용되지 않았어요',!h)}
  else if(a==='dclr'){await Media.folder.forget(app);say('앱 전용 폴더를 해제했어요')}
  S.dirs=await loadDirs();render();
}
async function dirPull(){
  const m=$('#dmsg');m.textContent='서버의 대기 목록을 확인하는 중…';
  const idApp=new Map();for(const t of ID_TABLES)(await rows(t,'id')).forEach(r=>idApp.set(r.id,ROUTE[t]||''));
  const r=await Media.sync({route:id=>idApp.get(id)||'',onProgress:p=>m.textContent=`받는 중… ${p.done}/${p.total}`});
  m.textContent=r.total?`완료: ${r.done}/${r.total}`+(r.failed.length?` · 실패 ${r.failed.length}개 (${[...new Set(r.failed.map(f=>f.error))].join(', ')})`:''):'대기 중인 원본이 없어요';
}

/* ---------- 백업 (Supabase 테이블을 있는 그대로 PC 폴더에 저장) ----------
   폴더는 "원본 폴더"와 같은 방식으로 이 PC·이 브라우저에 기억해요(구글 드라이브 폴더를 지정하면 드라이브에 올라가요).
   저장 모양: <폴더>/<날짜>/<테이블>.json (복구용, 있는 그대로) + <테이블>.csv (엑셀·시트로 열어 보기용, 같은 내용)
              + _schema.json (테이블 구조) + _요약.csv (테이블별 줄 수와 지난번 대비 증감)
   테이블 목록은 DB 함수 mnmn_backup_schema()가 알려 줘서, 새 테이블이 생겨도 자동으로 포함돼요.
   BAK_SKIP의 테이블은 빼요(다시 받을 수 있는 큰 공공데이터). 7일이 지났으면 mnmn을 열 때 자동으로 한 번 해요. */
const BAK_APP='_backup',BAK_SKIP=['bdbd_food'],BAK_DAYS=7,BAK_KEY='mnmn_bak_last';
const bakLast=()=>{try{return JSON.parse(localStorage.getItem(BAK_KEY)||'null')}catch(e){return null}};
const bakAge=()=>{const l=bakLast();return l?Math.floor((Date.now()-l.at)/864e5):null};
const kday=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);   // 한국 날짜
async function bakDir(ask){
  const h=await Media.folder.own(BAK_APP);if(!h)return null;
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted'&&ask)p=await h.requestPermission({mode:'readwrite'});
  return p==='granted'?h:null;
}
async function bakInfo(){
  if(!Media.folder.supported)return {un:true};
  const h=await Media.folder.own(BAK_APP);let perm='',days=[];
  if(h){perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted')try{for await(const [n,e] of h.entries())if(e.kind==='directory'&&/^\d{4}-\d\d-\d\d$/.test(n))days.push(n)}catch(e){}}
  return {name:h?h.name:'',perm,days:days.sort().reverse()};
}
function vBak(){
  const b=S.bak||{},l=bakLast(),age=bakAge();
  if(b.un)return '<div class="sum">이 브라우저에서는 폴더를 지정할 수 없어요. PC의 Chrome이나 Edge에서 열어 주세요.</div>';
  return `<div class="sum">Supabase의 모든 테이블을 있는 그대로 PC 폴더에 저장해요. 구글 드라이브 폴더를 지정하면 드라이브에도 올라가요. 마지막 백업에서 ${BAK_DAYS}일이 지나면 이 PC에서 mnmn을 열 때 자동으로 한 번 해요. (${E(BAK_SKIP.join(', '))}는 다시 받을 수 있는 큰 데이터라 빼요)</div>
  <div class="row"><div class="t"><b>백업 폴더</b><br>${b.name?'📁 '+E(b.name)+(b.perm==='granted'?' · ✅ 권한 있음':' · ⚠️ 권한 필요'):'지정 안 됨'}</div>
    <button data-a="bkset">폴더 지정</button>${b.name&&b.perm!=='granted'?'<button data-a="bkperm">권한 허용</button>':''}${b.name?'<button data-a="bkclr">해제</button>':''}</div>
  <div class="row"><div class="t"><b>마지막 백업</b><br>${l?`${E(l.day)} (${age===0?'오늘':age+'일 전'}) · 테이블 ${l.tables}개 · ${l.rows.toLocaleString()}줄 · ${fmt(l.bytes)}`:'아직 없음'}</div>
    <button data-a="bkrun"${b.name?'':' disabled'}>지금 백업</button></div>
  <div id="bmsg" class="hint"></div>
  ${b.days&&b.days.length?`<h3>폴더에 있는 백업 ${b.days.length}개</h3><div class="t">${b.days.slice(0,60).map(E).join(' · ')}${b.days.length>60?' …':''}</div><div class="hint">오래된 백업은 자동으로 지우지 않아요. 필요 없으면 폴더에서 날짜 폴더째 지우면 돼요.</div>`:''}`;
}
async function bakAction(a){
  if(a==='bkset'){const h=await showDirectoryPicker({mode:'readwrite',id:'mnmn-backup'});await Media.folder.setHandle(h,BAK_APP);say('백업 폴더를 지정했어요')}
  else if(a==='bkperm'){const h=await bakDir(true);say(h?'권한을 허용했어요':'권한이 허용되지 않았어요',!h)}
  else if(a==='bkclr'){await Media.folder.forget(BAK_APP);say('백업 폴더 지정을 해제했어요 (이미 저장된 파일은 그대로 있어요)')}
  S.bak=await bakInfo();render();
}
const csvCell=v=>{if(v===null||v===undefined)return '';const t=typeof v==='object'?JSON.stringify(v):String(v);return /[",\r\n]/.test(t)||/^\s|\s$/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const toCsv=(cols,list)=>'﻿'+[cols.map(csvCell).join(',')].concat(list.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n')+'\r\n';
async function bakWrite(dir,name,text){
  const f=await dir.getFileHandle(name,{create:true}),w=await f.createWritable();
  const b=new Blob([text]);await w.write(b);await w.close();return b.size;
}
async function bakRun(auto){
  const out=t=>{const m=$('#bmsg');if(m)m.textContent=t;else if(t)say(t)};
  const root=await bakDir(!auto);
  if(!root){if(!auto)say('백업 폴더를 지정하고 권한을 허용해 주세요',1);return false}
  out('테이블 목록을 확인하는 중…');
  const r=await fetch(`${SB}/rest/v1/rpc/mnmn_backup_schema`,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:'{}'});
  if(!r.ok)throw new Error('테이블 목록을 못 받았어요 (HTTP '+r.status+')');
  const schema=await r.json(),list=schema.filter(t=>!BAK_SKIP.includes(t.table));
  const day=kday(),dir=await root.getDirectoryHandle(day,{create:true});
  const prev=(bakLast()||{}).counts||{},counts={},sum=[['테이블','줄 수','지난 백업 대비']];
  let bytes=0,total=0,i=0;
  for(const t of list){
    out(`받는 중… ${++i}/${list.length} (${t.table})`);
    const cols=t.columns.map(c=>c.name),ord=(t.pk&&t.pk.length?t.pk:cols.slice(0,1)).map(c=>encodeURIComponent(c)).join(',');
    const data=await rows(t.table,'*','&order='+ord);
    bytes+=await bakWrite(dir,t.table+'.json',JSON.stringify(data,null,1));
    bytes+=await bakWrite(dir,t.table+'.csv',toCsv(cols,data));
    counts[t.table]=data.length;total+=data.length;
    const d=t.table in prev?data.length-prev[t.table]:null;
    sum.push([t.table,data.length,d===null?'(처음)':d>0?'+'+d:String(d)]);
  }
  for(const k of Object.keys(prev))if(!(k in counts))sum.push([k,'',' (없어진 테이블)']);
  bytes+=await bakWrite(dir,'_schema.json',JSON.stringify({saved_at:new Date().toISOString(),skipped:BAK_SKIP,tables:schema},null,1));
  bytes+=await bakWrite(dir,'_요약.csv','﻿'+sum.map(l=>l.map(csvCell).join(',')).join('\r\n')+'\r\n');
  localStorage.setItem(BAK_KEY,JSON.stringify({at:Date.now(),day,tables:list.length,rows:total,bytes,counts}));
  say(`백업 완료: ${day} · 테이블 ${list.length}개 · ${total.toLocaleString()}줄 · ${fmt(bytes)}`);
  if(S.tab==='bak'){S.bak=await bakInfo();render()}
  return true;
}
/* mnmn을 열 때: 백업 폴더가 있고 마지막 백업이 오래됐으면 자동으로. 권한이 꺼져 있으면(브라우저를 다시 켠 뒤) 안내만 해요 */
async function bakAuto(){
  try{
    if(!SES||!Media.folder.supported)return;
    const h=await Media.folder.own(BAK_APP);if(!h)return;
    const age=bakAge();if(age!==null&&age<BAK_DAYS)return;
    if(await h.queryPermission({mode:'readwrite'})==='granted')await bakRun(true);
    else say(`백업한 지 ${age===null?'오래':age+'일'} 됐어요. "백업" 탭에서 "지금 백업"을 눌러 주세요.`);
  }catch(e){say('자동 백업 실패: '+e.message,1)}
}

/* ---------- 상태 / 화면 ---------- */
const S={tab:'img',filter:'all',imgs:[],trash:[],inbox:[],sel:new Set(),fset:new Map(),fonts:[]};
const say=(t,err)=>{const m=$('#msg');m.hidden=!t;m.className=err?'err':'';m.textContent=t||''};
const fresh=o=>Date.now()-o.at<864e5;
const prot=o=>!S.inclFresh&&fresh(o);   // 복구한 파일도 '새로 올라온 것'으로 보여 24시간 동안 보호됨   // 24시간 안에 올라온 것은 저장 직전일 수 있어 삭제 후보에서 제외
const pick=()=>[...S.sel];

async function load(){
  say('불러오는 중…');S.sel.clear();
  try{
    if(S.tab==='img'){
      const [objs,use]=await Promise.all([Media.list('images/'),scan()]);
      S.imgs=objs.filter(o=>!o.key.endsWith('/')).map(o=>({key:o.key,h:hashOf(o.key),size:o.size,at:new Date(o.uploaded),use:use.get(hashOf(o.key))||null})).sort((a,b)=>b.at-a.at);
    }else if(S.tab==='font'){
      const [st,fl]=await Promise.all([rows('mnmn_setting','app,role,value'),fetch(W+'/fonts',{headers:{Authorization:'Bearer '+await token()}}).then(r=>r.json())]);
      S.fset=new Map(st.map(r=>[r.app+'|'+r.role,r.value]));S.fonts=(fl.fonts||[]).map(f=>({file:f.file||f.name,size:f.size}));
    }else if(S.tab==='bak'){
      S.bak=await bakInfo();
    }else if(S.tab==='dir'){
      S.dirs=await loadDirs();
    }else if(S.tab==='trash'){
      S.trash=(await Media.list('trash/')).filter(o=>!o.key.endsWith('/')).map(o=>({key:o.key,size:o.size,at:new Date(o.uploaded)})).sort((a,b)=>b.at-a.at);
    }else{
      const ids=new Set();for(const t of ID_TABLES)(await rows(t,'id')).forEach(r=>ids.add(r.id));
      S.inbox=(await Media.pending()).map(o=>({...o,at:new Date(o.uploaded),linked:ids.has(o.id)})).sort((a,b)=>b.at-a.at);
    }
    say('');
  }catch(e){say(e.message,1)}
  render();
}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  $('#view').innerHTML=S.tab==='img'?vImg():S.tab==='trash'?vTrash():S.tab==='font'?vFont():S.tab==='dir'?vDir():S.tab==='bak'?vBak():vInbox();
  if(S.tab==='font')fontPreview();
  if(S.tab==='trash')document.querySelectorAll('img[data-k]').forEach(async i=>{
    try{const r=await fetch(`${W}/o/${i.dataset.k}`,{headers:{Authorization:'Bearer '+await token()}});if(r.ok)i.src=URL.createObjectURL(await r.blob())}catch(e){}
  });
}
const uses=o=>o.use?Object.entries(o.use).map(([k,n])=>`${k}${n>1?' ×'+n:''}`).join(', '):'';
function vImg(){
  const L=S.imgs,un=L.filter(o=>!o.use),shown=L.filter(o=>S.filter==='all'||(S.filter==='used'?o.use:!o.use));
  const sel=pick().length;
  return `<div class="sum">총 ${L.length}장 · ${fmt(L.reduce((a,o)=>a+o.size,0))} · 사용 중 ${L.length-un.length}장 · <b class="n">미사용 ${un.length}장 (${fmt(un.reduce((a,o)=>a+o.size,0))})</b>${un.some(fresh)?` · 24시간 보호 중 ${un.filter(fresh).length}장`:''}</div>
  <div class="bar"><select id="flt"><option value="all"${S.filter==='all'?' selected':''}>전체</option><option value="used"${S.filter==='used'?' selected':''}>사용 중</option><option value="unused"${S.filter==='unused'?' selected':''}>미사용</option></select>
  <button data-a="selun">미사용 전체 선택</button><label class="t"><input type="checkbox" id="incl"${S.inclFresh?' checked':''}> 방금 올리거나 복구한 것도 포함</label><button data-a="clr">선택 해제</button>
  <button data-a="totrash" class="danger"${sel?'':' disabled'}>선택 ${sel}장 휴지통으로</button><button data-a="reload">새로고침</button></div>
  <div class="grid">${shown.map(o=>{const ok=!o.use&&!prot(o);return `<div class="c${S.sel.has(o.key)?' sel':''}">${ok?`<input type="checkbox" data-k="${E(o.key)}"${S.sel.has(o.key)?' checked':''}>`:''}
    <img src="${W}/o/${E(o.key)}" loading="lazy" alt=""><div class="t">${E(o.h.slice(0,10))} · ${fmt(o.size)}<br>${day(o.at)}</div>
    <div>${o.use?`<span class="u">${E(uses(o))}</span>`:prot(o)?'<span class="t">방금 올림·복구 (24시간 보호)</span>':'<span class="n">미사용</span>'}</div></div>`}).join('')||'<p class="t">이미지가 없어요</p>'}</div>`;
}
function vTrash(){
  const sel=pick().length;
  return `<div class="sum">휴지통 ${S.trash.length}개 · ${fmt(S.trash.reduce((a,o)=>a+o.size,0))} · 7일 뒤 자동으로 지워져요</div>
  <div class="bar"><button data-a="seltr">전체 선택</button><button data-a="clr">선택 해제</button><button data-a="restore"${sel?'':' disabled'}>선택 ${sel}개 복구</button><button data-a="purge" class="danger"${sel?'':' disabled'}>선택 ${sel}개 영구 삭제</button><button data-a="reload">새로고침</button></div>
  ${S.trash.map(o=>`<div class="row"><input type="checkbox" data-k="${E(o.key)}"${S.sel.has(o.key)?' checked':''}>${o.key.startsWith('trash/images/')?`<img data-k="${E(o.key)}" alt="">`:'<span style="width:48px"></span>'}<div class="t">${E(o.key.slice(6))}<br>${fmt(o.size)} · ${day(o.at)}</div></div>`).join('')||'<p class="t">비어 있어요</p>'}`;
}
function vInbox(){
  const orph=S.inbox.filter(o=>!o.linked),sel=pick().length;
  return `<div class="sum">서버에 대기 중인 원본 ${S.inbox.length}개 · ${fmt(S.inbox.reduce((a,o)=>a+o.size,0))} ("원본 폴더" 탭의 "원본 받기"로 PC 폴더에 가져가면 비워져요)</div>
  <div class="bar"><button data-a="selor"${orph.length?'':' disabled'}>행 없는 원본 ${orph.length}개 선택</button><button data-a="clr">선택 해제</button><button data-a="totrash" class="danger"${sel?'':' disabled'}>선택 ${sel}개 휴지통으로</button><button data-a="reload">새로고침</button></div>
  ${S.inbox.map(o=>`<div class="row">${o.linked?'<span style="width:18px"></span>':`<input type="checkbox" data-k="${E(o.key)}"${S.sel.has(o.key)?' checked':''}>`}<div class="t">${E(o.id)}.${E(o.ext)}<br>${fmt(o.size)} · ${day(o.at)}</div><span class="${o.linked?'u':'n'}">${o.linked?'연결된 행 있음':'연결된 행 없음'}</span></div>`).join('')||'<p class="t">대기 중인 원본이 없어요</p>'}`;
}

/* ---------- 글꼴 ---------- */
const FV=(a,r)=>S.fset.get(a+'|'+r)||'';
function fopt(sel){
  const C=Fonts.CATALOG,o=(v,n)=>`<option value="${E(v)}"${v===sel?' selected':''}>${E(n)}</option>`;
  return `<option value="">앱 기본값</option><optgroup label="기본 제공">${C.google.map(f=>o(f.v,f.n)).join('')}</optgroup><optgroup label="시스템 글꼴">${C.system.map(f=>o(f.v,f.n)).join('')}</optgroup>${S.fonts.length?`<optgroup label="내가 올린 글꼴">${S.fonts.map(f=>o('u:'+f.file,f.file)).join('')}</optgroup>`:''}`;
}
const fsel=(a,r,ko)=>`<select data-fs="${E(a)}|${E(r)}${ko?'.ko':''}">${fopt(FV(a,r+(ko?'.ko':'')))}</select>`;
function vFont(){
  const unify=FV('*','mode')==='unify';
  return `<div class="sum">앱에 쓸 글꼴을 정해요. 바꾸면 바로 저장되고, 각 앱은 다음에 열 때(또는 새로고침) 반영돼요. 영문 글꼴은 영어·숫자에, 한글 글꼴은 한글에 써요(비워 두면 영문 글꼴이 한글까지 맡거나 앱 기본값).</div>
  <h3>모든 앱 통일</h3>
  <div class="bar"><label><input type="radio" name="fmode" value="per"${unify?'':' checked'}> 앱·영역별로 따로</label> <label><input type="radio" name="fmode" value="unify"${unify?' checked':''}> 모든 앱 모든 영역을 아래 글꼴 하나로 통일</label></div>
  <div class="fa"><div>통일 글꼴</div>${fsel('*','all')}${fsel('*','all',1)}<div class="pv" data-pv="*|all"></div></div>
  <h3>앱별 (영역마다)</h3>
  ${Object.entries(Fonts.APPS).map(([a,A])=>`<div class="fh">${E(A.label)}</div>${Object.entries(A.roles).map(([r,R])=>`<div class="fa"><div>${E(R.label)}</div>${fsel(a,r)}${fsel(a,r,1)}<div class="pv" data-pv="${E(a)}|${E(r)}"></div></div>`).join('')}`).join('')}
  <h3>올린 글꼴</h3>
  <div class="bar"><input type="file" id="ffile" accept=".ttf,.otf,.woff,.woff2" multiple><button data-a="fup">올리기</button><span class="t">ttf · otf · woff · woff2 (20MB까지, 3MB 이하가 가볍고 빨라요)</span></div>
  ${S.fonts.map(f=>`<div class="row"><div class="t">${E(f.file)}<br>${fmt(f.size)}</div><button data-fdel="${E(f.file)}" class="danger">삭제</button></div>`).join('')||'<p class="t">올린 글꼴이 없어요</p>'}`;
}
function fontPreview(){
  const sample='가나다라마바 ABC abc 123 — The quick brown fox';
  document.querySelectorAll('[data-pv]').forEach(el=>{
    const [a,r]=el.dataset.pv.split('|'),en=FV(a,r),ko=FV(a,r+'.ko');[en,ko].forEach(Fonts.ensure);
    const st=Fonts.stack(en,ko,'sans-serif');el.style.fontFamily=st||'';el.textContent=st?sample:'';
  });
}
async function saveSet(key,val){
  const [a,r]=key.split('|'),tk=await token();
  const H={apikey:ANON,Authorization:'Bearer '+tk,'Content-Type':'application/json'};
  const res=val?await fetch(`${SB}/rest/v1/mnmn_setting?on_conflict=user_id,app,role`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{app:a,role:r,value:val}])})
    :await fetch(`${SB}/rest/v1/mnmn_setting?app=eq.${encodeURIComponent(a)}&role=eq.${encodeURIComponent(r)}`,{method:'DELETE',headers:H});
  if(!res.ok)throw new Error('저장하지 못했어요 (HTTP '+res.status+')');
  val?S.fset.set(key,val):S.fset.delete(key);
}
document.addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.dataset.fs!==undefined){await saveSet(t.dataset.fs,t.value);say('저장했어요');fontPreview()}
    else if(t.name==='fmode'){await saveSet('*|mode',t.value==='unify'?'unify':'');say(t.value==='unify'?'통일 켬':'통일 끔')}
  }catch(x){say(x.message,1)}
});
async function fontUp(){
  const fs=[...($('#ffile').files||[])];if(!fs.length)return say('올릴 파일을 먼저 고르세요',1);
  try{
    for(const f of fs){
      say(`올리는 중… ${f.name}`);const fd=new FormData();fd.append('file',f);
      const r=await fetch(W+'/font',{method:'POST',headers:{Authorization:'Bearer '+await token()},body:fd}),j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(f.name+': '+(j.error||'HTTP '+r.status));
    }
    await load();say(`${fs.length}개 올렸어요`);
  }catch(x){say(x.message,1)}
}
async function fontDel(file){
  const used=[...S.fset].filter(([,v])=>v==='u:'+file);
  if(!confirm(`'${file}'을(를) 지울까요?`+(used.length?`\n지금 ${used.length}곳에서 쓰는 중이라 그 설정은 '앱 기본값'으로 돌아가요.`:'')))return;
  try{
    for(const [k] of used)await saveSet(k,'');
    const r=await fetch(W+'/font/delete',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({name:file})}),j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||'HTTP '+r.status);
    await load();say('지웠어요');
  }catch(x){say(x.message,1)}
}
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-fdel]');if(d)return fontDel(d.dataset.fdel);
  if(e.target.closest('[data-a="fup"]'))fontUp();
});

/* ---------- 동작 ---------- */
async function act(a,el){
  try{
    if(a==='fup')return;
    if(a==='dset'||a==='dperm'||a==='dclr')return dirAction(a,el.dataset.app);
    if(a==='dpull')return dirPull();
    if(a==='bkset'||a==='bkperm'||a==='bkclr')return bakAction(a);
    if(a==='bkrun')return bakRun(false);
    if(a==='reload')return load();
    if(a==='clr'){S.sel.clear();return render()}
    if(a==='selun'){S.sel=new Set(S.imgs.filter(o=>!o.use&&!prot(o)).map(o=>o.key));return render()}
    if(a==='seltr'){S.sel=new Set(S.trash.map(o=>o.key));return render()}
    if(a==='selor'){S.sel=new Set(S.inbox.filter(o=>!o.linked).map(o=>o.key));return render()}
    let keys=pick();if(!keys.length)return;
    if(a==='totrash'){
      if(S.tab==='img'){   // 삭제 직전에 사용처를 다시 확인해서, 그새 쓰이기 시작한 이미지는 건너뜀
        say('사용처를 다시 확인하는 중…');const use=await scan(),n=keys.length;keys=keys.filter(k=>!use.has(hashOf(k)));
        if(keys.length<n)say(`${n-keys.length}장은 그새 사용 중이라 제외했어요`);
      }
      if(!keys.length||!confirm(`${keys.length}개를 휴지통으로 옮길까요? (7일 안에는 복구할 수 있어요)`))return load();
      const r=await Media.trash(keys);say(`휴지통으로 이동: ${r.moved.length}개`+(r.missing.length?` · 이미 없음 ${r.missing.length}개`:''));
    }else if(a==='restore'){
      const r=await Media.restore(keys);say(`복구: ${r.moved.length}개`);
    }else if(a==='purge'){
      if(!confirm(`${keys.length}개를 영구 삭제할까요? 되돌릴 수 없어요.`))return;
      const r=await Media.purge(keys);say(`영구 삭제: ${r.moved.length}개`);
    }
    const m=$('#msg').textContent;await load();if(m)say(m);
  }catch(e){say(e.message,1)}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;S.sel.clear();load();return}
  const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b);
});
document.addEventListener('change',e=>{
  if(e.target.id==='incl'){S.inclFresh=e.target.checked;S.sel.clear();render();return}
  if(e.target.id==='flt'){S.filter=e.target.value;render();return}
  const k=e.target.dataset.k;if(k&&e.target.type==='checkbox'){e.target.checked?S.sel.add(k):S.sel.delete(k);render()}
});
$('#out').onclick=()=>{saveSes(null);show()};
$('#go').onclick=async()=>{
  $('#lmsg').textContent='';
  try{saveSes(await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value}));show()}catch(e){$('#lmsg').textContent=e.message}
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
/* ---------- 작업 중 표시: 끝날 때까지 클릭을 막고 닫기·새로고침 경고 ---------- */
let BUSY=0;
function busyOn(){BUSY++;document.body.classList.add('busy');$('#busy').hidden=false}
function busyOff(){BUSY=Math.max(0,BUSY-1);if(!BUSY){document.body.classList.remove('busy');$('#busy').hidden=true}}
const wrapBusy=f=>async function(...a){busyOn();try{return await f.apply(this,a)}finally{busyOff()}};
bakRun=wrapBusy(bakRun);load=wrapBusy(load);act=wrapBusy(act);fontUp=wrapBusy(fontUp);fontDel=wrapBusy(fontDel);dirAction=wrapBusy(dirAction);dirPull=wrapBusy(dirPull);
document.addEventListener('click',e=>{if(BUSY&&e.target.closest('button,[data-a],[data-tab],[data-fdel]')){e.stopPropagation();e.preventDefault()}},true);
addEventListener('beforeunload',e=>{if(BUSY){e.preventDefault();e.returnValue=''}});
function show(){$('#login').hidden=!!SES;$('#app').hidden=!SES;if(SES)load().then(bakAuto)}
show();
</script>
</body>
</html>
